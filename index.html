<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experto Universitario en Dinamización Digital - Ágata Puig</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #662483;
            --color-primary-light: #8a36b0;
            --color-accent: #f6a000;
            --color-accent-soft: #ffe433;
            --color-text-main: #111827;
            --color-text-muted: #4b5563;
            --color-bg-light: #fafafa;
            --color-bg-white: #ffffff;
            --radius-box: 24px;
            --radius-btn: 50px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--color-bg-white);
            font-family: 'Montserrat', sans-serif;
            color: var(--color-text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        #app {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 200px;
        }

        /* The vertical "path" line */
        .path-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 8px;
            background: rgba(102, 36, 131, 0.05);
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        .item-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            z-index: 2;
        }

        .character-wrapper {
            position: relative;
            width: 120px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Connecting lines between people */
        .character-wrapper::after {
            content: "";
            position: absolute;
            bottom: -35px;
            left: 50%;
            width: 4px;
            height: 35px;
            background: rgba(102, 36, 131, 0.3);
            transform: translateX(-50%);
            z-index: -1;
        }

        .character {
            width: 100px;
            height: 160px;
            transform-origin: bottom center;
            animation: idle 2.5s ease-in-out infinite alternate;
        }

        @keyframes idle {
            0% { transform: scaleY(1) rotate(-1deg); }
            100% { transform: scaleY(1.05) rotate(1deg); }
        }

        /* Speech bubbles */
        .speech-bubble {
            position: absolute;
            left: 140px;
            bottom: 100px;
            background: white;
            border: 3px solid var(--color-primary);
            border-radius: var(--radius-box);
            padding: 25px;
            width: 350px;
            box-shadow: 10px 10px 0px rgba(102, 36, 131, 0.1);
            opacity: 0;
            transform: translateX(40px) scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            font-weight: 700;
            font-size: 1.2rem;
            z-index: 10;
            color: var(--color-primary);
        }

        .item-container.active .speech-bubble {
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            left: -15px;
            bottom: 30px;
            border-width: 12px 15px 12px 0;
            border-style: solid;
            border-color: transparent var(--color-primary) transparent transparent;
        }

        /* Curve logic - we apply classes to containers to push characters */
        .curve-left .character-wrapper { transform: translateX(-180px); }
        .curve-right .character-wrapper { transform: translateX(180px); }

        .curve-left .speech-bubble { left: auto; right: 140px; transform: translateX(-40px) scale(0.8); }
        .curve-left .speech-bubble::after { left: auto; right: -15px; border-width: 12px 0 12px 15px; border-color: transparent transparent transparent var(--color-primary); }
        .curve-left.active .speech-bubble { transform: translateX(0) scale(1); }

        /* Special elements */
        .special-content {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .item-container.active .special-content { opacity: 1; }

        .btn-cta {
            display: inline-block;
            background: var(--color-primary);
            color: white !important;
            padding: 1.2rem 2.5rem;
            border-radius: var(--radius-btn);
            text-decoration: none;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 10px 25px rgba(102, 36, 131, 0.3);
            transition: all 0.3s ease;
            border: 3px solid var(--color-primary);
        }
        .btn-cta:hover {
            background: var(--color-accent);
            border-color: var(--color-accent);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(246, 160, 0, 0.4);
        }

        .testimonial-card {
            background: #fff;
            border-left: 8px solid var(--color-accent);
            padding: 30px;
            border-radius: 0 var(--radius-box) var(--radius-box) 0;
            box-shadow: 0 10px 40px rgba(102, 36, 131, 0.08);
            text-align: left;
            margin: 20px;
            width: 100%;
        }
        .testimonial-author {
            color: var(--color-primary);
            font-weight: 800;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .img-block {
            width: 100%;
            max-width: 500px;
            border-radius: var(--radius-box);
            box-shadow: 0 20px 40px rgba(102, 36, 131, 0.1);
            border: 8px solid white;
        }

        .intro-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: linear-gradient(145deg, #ffffff, #fdf8ff);
        }

        .intro-title {
            font-size: 3rem;
            color: var(--color-primary);
            font-weight: 800;
            margin-bottom: 20px;
            max-width: 800px;
        }

        .scroll-indicator {
            margin-top: 40px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        @media (max-width: 768px) {
            .speech-bubble { width: 200px; font-size: 0.9rem; left: 80px; }
            .curve-left .speech-bubble { right: 80px; }
            .character-wrapper { transform: scale(0.8); }
            .curve-left .character-wrapper { transform: translateX(-100px) scale(0.8); }
            .curve-right .character-wrapper { transform: translateX(100px) scale(0.8); }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="intro-screen">
        <h1 class="intro-title">Mientras todo el mundo crea contenido, muy pocos saben crear pertenencia.</h1>
        <div class="scroll-indicator">
            <svg width="30" height="50" viewBox="0 0 30 50">
                <rect x="5" y="5" width="20" height="40" rx="10" fill="none" stroke="var(--color-primary)" stroke-width="2" />
                <circle cx="15" cy="15" r="3" fill="var(--color-primary)">
                    <animate attributeName="cy" values="15;35;15" dur="2s" repeatCount="indefinite" />
                </circle>
            </svg>
            <p style="color: var(--color-primary); font-weight: 600;">Haz scroll para caminar</p>
        </div>
    </div>
    <div class="path-line" id="pathLine"></div>
</div>

<script src="character_assets.js"></script>
<script src="extracted_content.js"></script>
<script>
    const app = document.getElementById('app');

    function init() {
        content.forEach((item, index) => {
            const container = document.createElement('div');
            container.className = 'item-container';

            // Randomly choose a character template and colors
            const templateIdx = Math.floor(Math.random() * characterTemplates.length);
            const color = colors[Math.floor(Math.random() * colors.length)];
            const skin = skins[Math.floor(Math.random() * skins.length)];
            const hair = hairs[Math.floor(Math.random() * hairs.length)];
            const scale = 0.9 + Math.random() * 0.2;

            const charWrapper = document.createElement('div');
            charWrapper.className = 'character-wrapper';
            charWrapper.innerHTML = characterTemplates[templateIdx](color, skin, hair, scale);

            const bubble = document.createElement('div');
            bubble.className = 'speech-bubble';
            bubble.innerText = item.text;

            // Handle special types and curves
            if (item.type === 'cta') {
                container.classList.add('curve-left');
                const special = document.createElement('div');
                special.className = 'special-content';
                special.innerHTML = `<a href="${item.url}" target="_blank" class="btn-cta">${item.text}</a>`;
                container.appendChild(special);
                bubble.innerText = "¡Haz clic aquí mismo!";
            } else if (item.type === 'testimonial-start') {
                container.classList.add('curve-right');
                const special = document.createElement('div');
                special.className = 'special-content';
                special.innerHTML = `
                    <div class="testimonial-card">
                        <div class="testimonial-author">— ${item.author}</div>
                    </div>
                `;
                container.appendChild(special);
            } else if (item.type === 'image') {
                container.classList.add('curve-left');
                const special = document.createElement('div');
                special.className = 'special-content';
                special.innerHTML = `<img src="${item.url}" class="img-block" alt="Ágata Puig">`;
                container.appendChild(special);
                bubble.innerText = "¡Mira qué energía!";
            } else if (index % 10 === 0 && index !== 0) {
                // Add some natural curves occasionally even without special content
                container.classList.add(Math.random() > 0.5 ? 'curve-left' : 'curve-right');
            }

            charWrapper.appendChild(bubble);
            container.appendChild(charWrapper);
            app.appendChild(container);
        });

        // Setup Intersection Observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                } else {
                    // We keep it active once seen to maintain the "story" feel as you scroll?
                    // Or remove it to make it more interactive. The requirement says "se activa su frase".
                    // Let's remove it so only the one in focus is active.
                    entry.target.classList.remove('active');
                }
            });
        }, {
            threshold: 0.6,
            rootMargin: '-10% 0px -10% 0px'
        });

        document.querySelectorAll('.item-container').forEach(c => observer.observe(c));
    }

    init();
</script>

</body>
</html>
